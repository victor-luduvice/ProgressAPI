services:
  db:
    image: postgres:16
    container_name: estoque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque123
      POSTGRES_DB: estoque
    ports:
      - "5432:5432"
    volumes:
      - estoque-data:/var/lib/postgresql/data

volumes:
  estoque-data: